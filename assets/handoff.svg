<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc">
  <title id="title">From contract to accepted change</title>
  <desc id="desc">Claude sets a contract and reviews approaches. Backend and frontend workers implement in parallel. Claude verifies the combined changes. If a worker stalls, Claude isolates the attempt, takes over, and repeats the checks.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#7fa7c6"/>
    </marker>
    <marker id="retry" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#e9b96f"/>
    </marker>
  </defs>
  <rect width="1000" height="570" rx="22" fill="#0d1626"/>
  <g font-family="system-ui, -apple-system, sans-serif" fill="#eef5fa">
    <text x="38" y="52" font-size="31" font-weight="700">From contract to accepted change</text>
    <g fill="none" stroke="#7fa7c6" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M500 179V199H239V221"/>
      <path d="M500 179V199H761V221"/>
      <path d="M239 318V342H500V367"/>
      <path d="M500 462V497"/>
    </g>
    <path d="M761 318V342H500" fill="none" stroke="#7fa7c6" stroke-width="2.5"/>
    <g fill="none" stroke="#e9b96f" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#retry)">
      <path d="M678 410H703"/>
      <path d="M830 461V482H572V466"/>
    </g>
    <g stroke-width="1.5">
      <rect x="323" y="83" width="354" height="96" rx="13" fill="#172942" stroke="#79b8ee"/>
      <rect x="88" y="222" width="302" height="96" rx="13" fill="#172b36" stroke="#78d2c1"/>
      <rect x="610" y="222" width="302" height="96" rx="13" fill="#182d39" stroke="#78d2c1"/>
      <rect x="323" y="368" width="354" height="94" rx="13" fill="#172942" stroke="#79b8ee"/>
      <rect x="708" y="367" width="246" height="94" rx="13" fill="#35291d" stroke="#e9b96f"/>
      <rect x="371" y="498" width="258" height="46" rx="23" fill="#173b37" stroke="#78d2c1"/>
    </g>
    <g text-anchor="middle">
      <g font-size="24" font-weight="700">
        <text x="500" y="120">Claude · Lead</text>
        <text x="239" y="259">Codex · Backend</text>
        <text x="761" y="259">Gemini · Frontend</text>
        <text x="500" y="405">Claude · Review</text>
        <text x="831" y="404" fill="#ffe4b2">Claude · Takeover</text>
        <text x="500" y="528" font-size="20" fill="#bdf2df">Accepted and recorded</text>
      </g>
      <g font-size="18" fill="#c5d9ea">
        <text x="500" y="150">Define the API and evaluate approaches</text>
        <text x="239" y="290">Implement against the contract</text>
        <text x="761" y="290">Build against the same contract</text>
        <text x="500" y="435">Inspect diff and run integration checks</text>
        <text x="831" y="434" fill="#f0cf9c">Isolate the failed attempt</text>
      </g>
    </g>
    <text x="38" y="529" fill="#c5d9ea" font-size="16">Dashed path · takeover and recheck</text>
  </g>
</svg>
